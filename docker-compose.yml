services:
  # ── MongoDB Database ───────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: twitter-clone-db
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── App Server ─────────────────────────────────────────────
  twitter-clone:
    build: .
    image: twitter-clone:latest
    container_name: twitter-clone-app
    ports:
      - "8080:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Internal Docker network URI — no external DB needed
      - MONGO_URI=mongodb://mongo:27017/twitter-clone
      # JWT_SECRET is auto-generated by docker-entrypoint.sh on first run
      # and persisted in the app_data volume
      - FRONTEND_URL=http://117.247.52.90:8080
    volumes:
      - uploads_data:/app/uploads   # persists uploaded images
      - app_data:/app/data          # persists the auto-generated JWT secret
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

# ── Named Volumes ──────────────────────────────────────────
volumes:
  mongo_data:      # MongoDB data files
  uploads_data:    # User-uploaded images
  app_data:        # JWT secret & other app state
